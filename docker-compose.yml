services:
  projectsmanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: porthub:1.0.0
    container_name: projectsmanager
    ports:
      - "9000:9000"
    environment:
      PM_PORT: 9000
      NODE_ENV: production
      PM_ADMIN_USERNAME: ${PM_ADMIN_USERNAME:-admin}
      PM_ADMIN_PASSWORD: ${PM_ADMIN_PASSWORD:-admin}
      PM_AUTH_SECRET: ${PM_AUTH_SECRET:-change-this-secret}
    volumes:
      - projectsmanager-data:/app/server/data
    restart: unless-stopped

volumes:
  projectsmanager-data:
